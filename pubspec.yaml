name: walkmoney
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icônes
  cupertino_icons: ^1.0.2
  safe_device: ^1.3.8
  # Packages Google & Maps
  google_maps_utils: ^2.0.0
  google_navigation_flutter: ^0.8.1
  google_places_for_flutter: ^1.0.1
  google_directions_api: ^0.10.0
  maplibre_gl: ^0.25.0
  # Géolocalisation
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1
  latlong2: ^0.9.1
  maps_toolkit: ^3.0.0
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.0
  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  wakelock_plus: ^1.4.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0

  # Réseau et API
  dio: ^5.0.0
  http: ^1.1.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  open_route_service: ^1.0.0

  # Interface et UX
  get: ^4.6.6
  provider: ^6.1.5+1
  google_fonts: ^4.0.4
  flutter_html: ^3.0.0-beta.2
  intl: ^0.19.0
  image_picker: ^1.1.1
  flutter_osm_plugin: ^1.4.3

  # Outils techniques
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.3
  google_mlkit_text_recognition: ^0.11.0
  flutter_stripe: ^10.1.0
  permission_handler: ^12.0.1
  baseflow_plugin_template: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Cette section force tous les packages à utiliser la version 1.1.0 de http
dependency_overrides:
  http: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/map_icon.png
    - assets/images/locate_me.png
    - assets/images/car.png