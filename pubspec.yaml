name: walkmoney
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icônes
  cupertino_icons: ^1.0.2
  flutter_secure_storage: ^11.0.0
  # Packages Google & Maps
  google_maps_utils: ^2.0.0
  google_places_for_flutter: ^1.0.1
  google_directions_api: ^0.10.0
  maplibre_gl: ^0.25.0
  # Géolocalisation
  geolocator: ^13.0.0
  flutter_compass: ^0.8.1
  latlong2: ^0.9.1
  maps_toolkit: ^3.0.0
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.3.2
  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  wakelock_plus: ^1.4.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  firebase_app_check: ^0.3.0
  sensors_plus: ^7.1.0

  # Réseau et API
  dio: ^5.0.0
  http: ^1.1.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  open_route_service: ^1.0.0

  # Interface et UX
  get: ^4.6.6
  provider: ^6.1.5+1
  google_fonts: ^8.0.2  # Pin exact version to avoid 4.0.5 const-eval bug with FontWeight map
  intl: any
  image_picker: ^1.1.1

  # Outils techniques
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  baseflow_plugin_template: ^2.2.1
  google_generative_ai: ^0.4.7
  talker_flutter: ^5.1.19
  purchases_flutter: ^10.15.2
  purchases_ui_flutter: ^10.15.2
  google_mobile_ads: ^5.2.0

  path: any
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
dependency_overrides:
  http: ^1.1.0
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.17

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/map_icon.png
    - assets/images/locate_me.png
    - assets/images/car.png
    - assets/images/
